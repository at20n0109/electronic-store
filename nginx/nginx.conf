# Single-entry load balancer/reverse proxy for electronic-store.
# Routes:  /api/* -> backend (NestJS, port 3001)
#          everything else -> frontend (Next.js, port 3000)
# Service names "frontend"/"backend" are resolved through Docker's embedded
# DNS (127.0.0.11); `resolve` re-resolves on interval so `--scale frontend=N`
# works without an nginx reload.
#
# TLS: self-signed cert (nginx/certs/pcstore.{crt,key}) issued for
# DNS:localhost + IP:127.0.0.1 + IP:<LAN>. Swap the cert files for a
# Let's Encrypt/certbot bundle on the same paths (nginx/certs/) when a
# public domain is available — no config change needed.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

log_format lb '$remote_addr "$request" $status -> $upstream_addr ($upstream_response_time s)';
access_log /var/log/nginx/access.log lb;

upstream frontend_app {
    zone frontend_app 64k;
    least_conn;
    server frontend:3000 resolve;
}

upstream backend_app {
    zone backend_app 64k;
    least_conn;
    server backend:3001 resolve;
}

# Serve everything over TLS; plain HTTP just bounces to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/pcstore.crt;
    ssl_certificate_key /etc/nginx/certs/pcstore.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    # Static Next.js build output: immutable, shared across instances
    location /_next/static/ {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Local product/category images
    location /images/ {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }
}