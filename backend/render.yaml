# Optional Render Blueprint for the backend. You can also create the Web
# Service manually in the dashboard (Env group + root dir `backend`), which is
# what DEPLOY.md documents. Required secrets (NOT sync:false) must be provided
# via the Render dashboard "Environment" tab before the first deploy:
#   DATABASE_URL, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, ENCRYPTION_KEY,
#   S3_ACCESS_KEY, S3_SECRET_KEY, PAYMENT_SECRET, PAYMENT_WEBHOOK_SECRET,
#   PAYPAL_CLIENT_ID, PAYPAL_SECRET, PAYPAL_RETURN_URL, PAYPAL_CANCEL_URL
services:
  - type: web
    name: pc-store-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: sh -c "npx prisma migrate deploy && node dist/main"
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: CORS_ORIGIN
        sync: false
      # Data
      - key: DATABASE_URL
        sync: false
      # Auth
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: "900"
      - key: JWT_REFRESH_TTL
        value: "604800"
      - key: JWT_ISSUER
        value: pc-store-api
      - key: JWT_AUDIENCE
        value: pc-store-web
      - key: ENCRYPTION_KEY
        sync: false
      # Object storage (Cloudflare R2)
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_PUBLIC_URL
        sync: false
      # Payments
      - key: PAYMENT_PROVIDER
        value: paypal
      - key: PAYMENT_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_RETURN_URL
        sync: false
      - key: PAYPAL_CANCEL_URL
        sync: false
      - key: PAYPAL_CURRENCY
        value: USD
      - key: PAYPAL_USD_RATE
        value: "25000"
      # Frontend URL used for invoice QR verification links
      - key: NEXT_PUBLIC_APP_URL
        sync: false