# Load-balancing edge. Override file — infrastructure in docker-compose.yml
# stays unchanged. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.lb.yml up -d --build --scale frontend=2
# Only Nginx is exposed on the host (port 80); frontend/backend talk on the
# internal compose network. Frontend app is stateless (JWT in httpOnly cookies,
# carts/orders in the shared Postgres) so a plain round-robin/least-conn works.

services:

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_APP_URL: "https://localhost"
    environment:
      INTERNAL_API_URL: http://backend:3001
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://ecommerce:ecommerce_dev_password@postgres:5432/ecommerce?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minio_dev_password
      S3_BUCKET: electronic-store
      S3_REGION: us-east-1
      CORS_ORIGIN: https://localhost,http://localhost,http://127.0.0.1
      JWT_ACCESS_SECRET: dev_access_secret_change_in_prod_2026
      JWT_ACCESS_TTL: "900"
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_prod_2026
      JWT_REFRESH_TTL: "604800"
      PAYMENT_PROVIDER: mock
      PAYMENT_SECRET: dev_payment_secret_change_in_prod
      PAYMENT_WEBHOOK_SECRET: dev_webhook_secret_change_in_prod
      PAYMENT_VNPAY_TMN_CODE: dev_tmn_code_change_in_prod
      PAYPAL_CLIENT_ID: dev_paypal_client_id
      PAYPAL_SECRET: dev_paypal_secret
      PAYPAL_MODE: sandbox
      PAYPAL_RETURN_URL: https://localhost/api/v1/payments/paypal/return
      PAYPAL_CANCEL_URL: https://localhost/checkout
      PAYPAL_CURRENCY: USD
      PAYPAL_USD_RATE: "25000"
      # Secrets are never committed here. Compose reads this from the
      # environment (or a git-ignored .env) and fails loudly when it is unset.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in your environment before starting this stack}
      PAYMENT_VNPAY_RETURN_URL: https://localhost/payment/return
      NEXT_PUBLIC_APP_URL: https://localhost
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro